# Демо на GitHub Pages: статична збірка (nuxt generate) у підпапці /<назва репо>/, з noindex.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Домен для canonical, hreflang і og:image. Хост github.io завжди в нижньому регістрі
      - run: |
          echo "NUXT_PUBLIC_SITE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
          echo "NUXT_PUBLIC_I18N_BASE_URL=https://${OWNER,,}.github.io" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      # Storefront API: секрети репозиторію (Settings → Secrets → Actions). Без них сайт зібрався б на тимчасових
      # даних з app/data/, а кошик не працював би: на main це помилка, і лишається попередній деплой
      - if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$DOMAIN" ] || [ -z "$TOKEN" ]; then
            echo "::error::Set repository secrets NUXT_PUBLIC_SHOPIFY_STORE_DOMAIN and NUXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN"
            exit 1
          fi
        env:
          DOMAIN: ${{ secrets.NUXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          TOKEN: ${{ secrets.NUXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      - run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_NOINDEX: 'true'
          NUXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ secrets.NUXT_PUBLIC_SHOPIFY_STORE_DOMAIN }}
          NUXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.NUXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
